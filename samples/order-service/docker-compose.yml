services:
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: secret
  redis:
    image: redis:7
    ports: ["6379:6379"]
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
  order-service:
    build: .
    ports: ["8081:8081"]
    depends_on: [postgres, redis, kafka]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      KAFKA_BROKERS: kafka:9092
